# Publishes the gem on a `vX.Y.Z` tag, with RubyGems Trusted Publishing (OIDC).
# The trusted publisher for the gem `anway` uses the repository
# thadeu/anway-ruby and the workflow release.yml. No API key is necessary.
name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUBYGEMS_OWNER_ID: '103733'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true

      - name: Verify tag matches gem version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          gem_version="$(ruby -e 'require_relative "lib/anway/version"; print Anway::VERSION')"

          if [ "$tag" != "$gem_version" ]; then
            echo "Tag '$tag' does not match gem version '$gem_version'" >&2
            exit 1
          fi

          echo "GEM_VERSION=$gem_version" >> "$GITHUB_ENV"

      - name: Download server
        run: |
          version="v$(ruby -e 'require_relative "lib/anway/version"; print Anway::SERVER_VERSION')"
          name="anway-${version}-linux-amd64"

          mkdir -p "$RUNNER_TEMP/server"
          curl -fsSL "https://github.com/thadeu/anway/releases/download/${version}/${name}.tar.gz" | tar xz -C "$RUNNER_TEMP/server"
          echo "SERVER_BIN=$RUNNER_TEMP/server/$name/anway" >> "$GITHUB_ENV"

      - name: Test
        run: bundle exec rspec

      # One gem for the ruby platform, and one with the server for each
      # platform. Anway::SERVER_VERSION chooses the server.
      - name: Build
        run: bundle exec rake gems

      # A re-run of the same tag must not fail on "repushing is not allowed".
      - name: Check whether this version is already on RubyGems
        id: published
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://rubygems.org/api/v2/rubygems/anway/versions/${GEM_VERSION}.json")"

          echo "exists=$([ "$status" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # The credentials action has no owner input yet, and RubyGems needs the owner
      # to create a new gem. This step does the same exchange, with the owner.
      - name: Exchange OIDC token for a RubyGems API key
        if: steps.published.outputs.exists == 'false'
        run: |
          id_token="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)"

          echo "::add-mask::$id_token"

          body="$(jq -n --arg jwt "$id_token" --arg owner "$RUBYGEMS_OWNER_ID" '{jwt: $jwt, owner: $owner}')"

          reply="$(curl -sS --fail-with-body -X POST \
            -H 'content-type: application/json' -H 'accept: application/json' \
            -d "$body" https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token)"

          api_key="$(jq -r .rubygems_api_key <<< "$reply")"

          if [ -z "$api_key" ] || [ "$api_key" = "null" ]; then
            echo "RubyGems did not return an API key" >&2
            exit 1
          fi

          echo "::add-mask::$api_key"
          echo "GEM_HOST_API_KEY=$api_key" >> "$GITHUB_ENV"

      - name: Publish to RubyGems
        if: steps.published.outputs.exists == 'false'
        run: |
          for gem in pkg/*.gem; do
            gem push "$gem" < /dev/null
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: anway ${{ env.GEM_VERSION }}
          generate_release_notes: true
          files: pkg/*.gem
